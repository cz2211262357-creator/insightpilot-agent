[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "insightpilot-agent"
version = "0.1.0"
description = "Scoped and evidenced business analytics with LangGraph and protected MCP tools"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.1",
  "langgraph==1.2.17",
  "langgraph-checkpoint-postgres==3.2.0",
  "langchain-openai==1.7.2",
  "mcp==2.3.0",
  "sqlglot==30.24.0",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  "redis==8.1.0",
  "pandas==3.1.0",
  "plotly==7.1.0",
  "httpx==0.28.1",
  "pyjwt==2.15.1",
  "pwdlib[argon2]==0.3.1",
  "httpx2==2.16.0",
  "mcp-types==2.3.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2", "testcontainers==4.15.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/insightpilot"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]


[tool.hatch.build.targets.wheel.force-include]
"migrations" = "insightpilot/resources/migrations"
"fixtures" = "insightpilot/resources/fixtures"
